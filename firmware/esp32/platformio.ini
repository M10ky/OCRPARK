[platformio]
; =========================================================================
; SM-Park - Firmware ESP32 (barrière + capteurs)
; -------------------------------------------------------------------------
; Secrets Wi-Fi/MQTT : copier secrets.ini.example vers secrets.ini (ignoré par
; git) puis renseigner les valeurs, AVANT de compiler.
;     cp firmware/esp32/secrets.ini.example firmware/esp32/secrets.ini
; ⚠️ PlatformIO ignore SILENCIEUSEMENT un `extra_configs` introuvable : si
; secrets.ini est absent, le firmware se compile avec des sentinelles
; `CHANGE_ME_*` et refuse de démarrer (bandeau sur le moniteur série).
; Voir docs/fiches-de-production/phase-C-firmware-audit.md (F-13).
;
; Les `-D` de build_flags vivent dans secrets.ini (valeurs sensibles).
; Les drapeaux fonctionnels vivent ici, dans build_src_flags (option
; distincte : elle ne peut pas être écrasée par secrets.ini).
; =========================================================================
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Drapeaux fonctionnels (appliqués aux sources du dossier src/).
;   SMPARK_ENABLE_SENSORS : 1 = HC-SR04 + IR actifs, publication de
;                            `parking/state` et `parking/events`
;                         0 = mode sans matériel (démo backend seule)
;   SMPARK_ENABLE_SERVOS  : 1 = pilotage réel des servos
;                         0 = simulation logique (états de barrière seuls)
build_src_flags =
    -DSMPARK_ENABLE_SENSORS=1
    -DSMPARK_ENABLE_SERVOS=1

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  madhephaestus/ESP32Servo@^1.2.1
