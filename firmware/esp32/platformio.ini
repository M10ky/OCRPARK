[platformio]
; Secrets Wi-Fi/MQTT : copier secrets.ini.example vers secrets.ini (ignoré par
; git) puis renseigner les valeurs. Voir docs/tests/phase-7-tests-firmware.md.
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  madhephaestus/ESP32Servo@^1.2.1
