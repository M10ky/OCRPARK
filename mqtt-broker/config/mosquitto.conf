# =========================================================================
# SM-Park - Configuration Eclipse Mosquitto
# -------------------------------------------------------------------------
# Broker MQTT local reliant l'ESP32 au backend FastAPI.
# Authentification obligatoire (fichier passwd généré au démarrage).
# =========================================================================

# --- Identité / persistance ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Journalisation ---
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Sécurité ---
allow_anonymous false
password_file /mosquitto/data/passwd

# --- Listener MQTT (ESP32 <-> Backend) ---
listener 1883 0.0.0.0
protocol mqtt
max_connections -1

# --- Listener WebSockets (debug / navigateur, optionnel) ---
listener 9001 0.0.0.0
protocol websockets

# --- Bonnes pratiques ---
max_queued_messages 1000
message_size_limit 0
