# =========================================================================
# SM-Park - Orchestration Docker Compose
# -------------------------------------------------------------------------
# Services :
#   - mqtt-broker : Eclipse Mosquitto (phase 2)
#   - database    : PostgreSQL 16 (phase 2)
#   - backend     : FastAPI + WebSocket (phases 3 & 5)
#   - ocr-service : FastAPI + EasyOCR (phase 4)
#   - frontend    : Next.js (phase 6)
# Pour lancer : docker compose up -d --build
# Webcam (optionnel, matériel requis) :
#   docker compose -f docker-compose.yml -f docker-compose.camera.yml up -d
# =========================================================================

name: smpark

networks:
  smpark-net:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

services:

  # -----------------------------------------------------------------------
  # Broker MQTT - Eclipse Mosquitto
  # -----------------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: smpark-mqtt
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./mqtt-broker/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt-broker/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    networks:
      - smpark-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------------------
  # Base de données - PostgreSQL
  # -----------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: smpark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - smpark-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Backend - FastAPI (API + logique métier + WebSocket)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smpark-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: mqtt-broker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    networks:
      - smpark-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/live').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------------------
  # Service OCR - FastAPI + EasyOCR + OpenCV
  # -----------------------------------------------------------------------
  # Sans matériel : aucune webcam n'est montée (démarre partout). Pour donner
  # accès à /dev/video0, utiliser l'overlay dédié :
  #   docker compose -f docker-compose.yml -f docker-compose.camera.yml up -d
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: smpark-ocr
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${OCR_PORT:-8001}:8001"
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    group_add:
      - video
    privileged: true
    environment:
      - OCR_CAMERA_INDEX=0
    networks:
      - smpark-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/live').status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------------------
  # Frontend - Next.js
  # -----------------------------------------------------------------------
  # NEXT_PUBLIC_* sont intégrées au bundle au BUILD : ce sont des build args
  # (les mettre dans `environment:` n'aurait aucun effet côté client).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: smpark-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    networks:
      - smpark-net
